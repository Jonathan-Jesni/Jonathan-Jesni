name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Prepare output folder
        run: mkdir -p profile

      - name: Generate BandWidth card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=Jonathan-Jesni&repo=BandWidth&theme=tokyonight"
          path: profile/bandwidth.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate SynthRescue card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=Jonathan-Jesni&repo=SynthRescue&theme=tokyonight"
          path: profile/synthrescue.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Modified Double U-Net card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=Jonathan-Jesni&repo=Modified_DoubleUNet_Implementation&theme=tokyonight"
          path: profile/modified-double-unet.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Ludex card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=Jonathan-Jesni&repo=Ludex&theme=tokyonight"
          path: profile/ludex.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate activity streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=Jonathan-Jesni&theme=tokyonight&hide_border=true&disable_animations=true"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No card changes."
            exit 0
          fi

          git commit -m "chore: update README cards"
          git push
